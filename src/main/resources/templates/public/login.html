<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CrudZaso DB Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0C; }
    </style>
</head>
<body class="text-gray-100 flex items-center justify-center min-h-screen p-4">
<div class="bg-[#121214] border border-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">CrudZaso DB Manager</h1>
        <p class="text-gray-400 text-sm mt-2">Sign in to manage your database instances</p>
    </div>

    <div th:if="${errorMessage}" class="bg-red-950/40 border border-red-800 text-red-400 p-3 rounded-lg text-sm mb-5 text-center">
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${logoutMessage}" class="bg-blue-950/40 border border-blue-800 text-blue-400 p-3 rounded-lg text-sm mb-5 text-center">
        <span th:text="${logoutMessage}"></span>
    </div>

    <div th:if="${param.registered}" class="bg-green-950/40 border border-green-800 text-green-400 p-3 rounded-lg text-sm mb-5 text-center">
        Account created successfully! Please log in.
    </div>

    <form th:action="@{/auth/login}" method="POST" class="space-y-5">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Email Address</label>
            <input type="email" name="username" required
                   class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-4 py-2.5 text-gray-200 focus:outline-none focus:border-blue-500 transition-colors"
                   placeholder="you@example.com">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Password</label>
            <input type="password" name="password" required
                   class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-4 py-2.5 text-gray-200 focus:outline-none focus:border-blue-500 transition-colors"
                   placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg shadow-blue-600/20">
            Log In
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-400">
        Don't have an account?
        <a th:href="@{/auth/register}" class="text-blue-400 hover:underline">Register here</a>
    </div>
</div>
</body>
</html>
