<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CrudZaso DB Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0C; }
    </style>
</head>
<body class="text-gray-100 flex items-center justify-center min-h-screen p-4">
<div class="bg-[#121214] border border-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Create Account</h1>
        <p class="text-gray-400 text-sm mt-2">Get your private cloud database laboratory</p>
    </div>

    <div th:if="${error}" class="bg-red-950/40 border border-red-800 text-red-400 p-3 rounded-lg text-sm mb-5 text-center">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/auth/register}" th:object="${user}" method="POST" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">First Name</label>
                <input type="text" th:field="*{name}" required
                       class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-3 py-2 text-gray-200 focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Last Name</label>
                <input type="text" th:field="*{lastName}" required
                       class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-3 py-2 text-gray-200 focus:outline-none focus:border-blue-500 text-sm">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Email Address</label>
            <input type="email" th:field="*{email}" required
                   class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-3 py-2 text-gray-200 focus:outline-none focus:border-blue-500 text-sm"
                   placeholder="name@company.com">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Password</label>
            <input type="password" th:field="*{password}" required
                   class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-3 py-2 text-gray-200 focus:outline-none focus:border-blue-500 text-sm"
                   placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors mt-2 shadow-lg shadow-blue-600/20">
            Register
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-400">
        Already have an account?
        <a th:href="@{/auth/login}" class="text-blue-400 hover:underline">Log in</a>
    </div>
</div>
</body>
</html>
