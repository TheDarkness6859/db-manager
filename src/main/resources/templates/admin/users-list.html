<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Administration - CrudZaso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0C; }
    </style>
</head>
<body class="text-gray-100 min-h-screen">
<nav class="bg-[#121214] border-b border-gray-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
        <span class="text-xl font-bold text-red-500">CrudZaso Shield</span>
        <span class="bg-red-950 text-red-400 border border-red-900 text-xs px-2 py-0.5 rounded font-mono font-bold tracking-widest">SYSTEM ADMIN</span>
    </div>
    <div class="flex items-center space-x-6">
        <a th:href="@{/admin/databases}" class="text-sm text-gray-400 hover:text-white transition-colors">Global Containers Inventory</a>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="text-xs text-gray-500 hover:text-red-400 transition-colors">System Logout</button>
        </form>
    </div>
</nav>

<main class="max-w-6xl mx-auto p-6 mt-8">
    <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold">User Access Controls</h1>
            <p class="text-gray-400 text-sm mt-1">Suspend, evaluate or activate corporate database tenants</p>
        </div>

        <form th:action="@{/admin/users}" method="GET" class="flex max-w-md w-full">
            <input type="text" name="search" th:value="${currentSearch}" placeholder="Filter by user name or email..."
                   class="w-full bg-[#121214] border border-gray-800 rounded-l-lg px-4 py-2 text-sm text-gray-300 focus:outline-none focus:border-red-500">
            <button type="submit" class="bg-gray-800 border border-l-0 border-gray-800 text-sm px-4 rounded-r-lg text-gray-300 hover:bg-gray-700">
                Search
            </button>
        </form>
    </div>

    <div class="bg-[#121214] border border-gray-800 rounded-xl overflow-hidden shadow-2xl">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-[#18181C] border-b border-gray-800 text-xs font-semibold text-gray-400 uppercase tracking-wider font-mono">
                <th class="px-6 py-4">Full Identity Name</th>
                <th class="px-6 py-4">Account Email</th>
                <th class="px-6 py-4">System Status</th>
                <th class="px-6 py-4 text-right">Access Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-800/60 text-sm text-gray-300">
            <tr th:each="u : ${users}" class="hover:bg-gray-900/20 transition-colors">
                <td class="px-6 py-4 font-medium text-white" th:text="${u.name} + ' ' + ${u.lastName}">Emmanuel Suárez</td>
                <td class="px-6 py-4 font-mono text-gray-400" th:text="${u.email}">emmanuel@mail.com</td>
                <td class="px-6 py-4">
                            <span th:text="${u.status}"
                                  class="text-xs px-2 py-0.5 rounded font-mono font-bold"
                                  th:classappend="${u.status.name() == 'ACTIVATE' ? 'bg-green-950/50 text-green-400 border border-green-900' : 'bg-red-950/50 text-red-400 border border-red-900'}">
                            </span>
                </td>
                <td class="px-6 py-4 text-right">
                    <form th:if="${u.status.name() == 'ACTIVATE'}"
                          th:action="@{/admin/users/{id}/block(id=${u.id})}" method="POST" style="display:inline;">
                        <button type="submit" class="text-xs bg-red-950/40 border border-red-900 text-red-400 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded transition-all">
                            Suspend Account
                        </button>
                    </form>

                    <form th:if="${u.status.name() == 'BLOCKED'}"
                          th:action="@{/admin/users/{id}/unblock(id=${u.id})}" method="POST" style="display:inline;">
                        <button type="submit" class="text-xs bg-green-950/40 border border-green-900 text-green-400 hover:bg-green-600 hover:text-white px-3 py-1.5 rounded transition-all">
                            Lift Restriction
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.isEmpty()}">
                <td colspan="4" class="text-center py-8 text-gray-500 font-mono text-xs">
                    No matching user criteria registered in H2 core database.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
