<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Instance - CrudZaso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0C; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col">
<nav class="bg-[#121214] border-b border-gray-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
        <a th:href="@{/dashboard}" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500">CrudZaso</a>
        <span class="bg-gray-800 text-gray-400 text-xs px-2 py-0.5 rounded font-mono">NEW INSTANCE</span>
    </div>
    <a th:href="@{/dashboard}" class="text-sm text-gray-400 hover:text-white">← Back to Dashboard</a>
</nav>

<div class="flex-1 flex items-center justify-center p-6">
    <div class="bg-[#121214] border border-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-lg">
        <h2 class="text-xl font-bold mb-2">Configure Container Infrastructure</h2>
        <p class="text-gray-400 text-sm mb-6">Specify ports, engines and administrative credentials.</p>

        <div th:if="${error}" class="bg-red-950/40 border border-red-800 text-red-400 p-3 rounded-lg text-sm mb-6 text-center">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/dashboard/new}" th:object="${database}" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Instance Display Name</label>
                <input type="text" th:field="*{name}" required placeholder="my_dev_postgres"
                       class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Database Engine</label>
                        <select th:field="*{databaseEngine}" required
                                class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-3 py-2 text-gray-200 focus:outline-none focus:border-blue-500">
                            <option value="PostgreSQL">PostgreSQL (Alpine)</option>
                            <option value="MySQL">MySQL (Official 8.0)</option>
                            <option value="MongoDB">MongoDB (NoSQL 7.0)</option>
                        </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Host Outward Port</label>
                    <input type="number" th:field="*{port}" required placeholder="5433"
                           class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Root Username</label>
                    <input type="text" th:field="*{userDatabase}" required placeholder="admin"
                           class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Secure Password</label>
                    <input type="password" th:field="*{passwordDatabase}" required placeholder="••••••••"
                           class="w-full bg-[#18181C] border border-gray-800 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="pt-4 flex justify-end space-x-3">
                <a th:href="@{/dashboard}" class="bg-transparent border border-gray-800 hover:bg-gray-800/40 text-gray-400 px-4 py-2 rounded-lg text-sm transition-colors">
                    Cancel
                </a>
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors shadow-lg shadow-blue-600/20">
                    Deploy Container
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
